$kind: http-request
url: '{{base_url}}/v1/markets/ETH-USD/book'
method: GET
scripts:
- type: afterResponse
  code: |-
    pm.test('status is 200', function () { pm.response.to.have.status(200); });
    pm.test('last price is 3000', function () {
        const body = pm.response.json();
        pm.expect(body.last_price).to.eql('3000');
    });
  language: text/javascript
order: 6000
