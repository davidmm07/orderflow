$kind: http-request
url: '{{base_url}}/v1/markets/LINK-USD/book'
method: GET
scripts:
- type: afterResponse
  code: |-
    pm.test('status is 200', function () { pm.response.to.have.status(200); });
    pm.test('last price', function () {
        const body = pm.response.json();
        pm.expect(body.last_price).to.eql('20');
    });
  language: text/javascript
order: 3000
