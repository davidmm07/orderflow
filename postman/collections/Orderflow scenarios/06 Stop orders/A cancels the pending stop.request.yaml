$kind: http-request
url: '{{base_url}}/v1/markets/LINK-USD/orders/{{link_far_stop_id}}'
method: DELETE
headers:
  x-orderflow-key: '{{trader_a_key}}'
scripts:
- type: afterResponse
  code: |-
    pm.test('status is 200', function () { pm.response.to.have.status(200); });
    pm.test('cancelled before firing', function () {
        const body = pm.response.json();
        pm.expect(body.status).to.eql('cancelled');
    });
  language: text/javascript
order: 17000
