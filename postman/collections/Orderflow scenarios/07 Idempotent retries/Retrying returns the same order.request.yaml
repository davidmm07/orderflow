$kind: http-request
url: '{{base_url}}/v1/markets/BTC-USD/orders'
method: POST
headers:
  content-type: application/json
  x-orderflow-key: '{{trader_a_key}}'
  Idempotency-Key: '{{run_id}}-idem'
body:
  type: json
  content: |-
    {
      "side": "buy",
      "type": "limit",
      "price": "20000",
      "quantity": "0.01"
    }
scripts:
- type: afterResponse
  code: |-
    pm.test('status is 201', function () { pm.response.to.have.status(201); });
    pm.test('replayed response', function () {
        const body = pm.response.json();
        pm.expect(pm.response.headers.get('idempotent-replayed')).to.eql('true');
        pm.expect(body.order.id).to.eql(pm.collectionVariables.get('btc_idem_id'));
    });
  language: text/javascript
order: 2000
