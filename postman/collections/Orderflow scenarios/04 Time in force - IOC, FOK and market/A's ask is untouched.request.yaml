$kind: http-request
url: '{{base_url}}/v1/markets/SOL-USD/orders/{{sol_ask_id}}'
method: GET
headers:
  x-orderflow-key: '{{trader_a_key}}'
scripts:
- type: afterResponse
  code: |-
    pm.test('status is 200', function () { pm.response.to.have.status(200); });
    pm.test('still open', function () {
        const body = pm.response.json();
        pm.expect(body.status).to.eql('open');
    });
  language: text/javascript
order: 5000
