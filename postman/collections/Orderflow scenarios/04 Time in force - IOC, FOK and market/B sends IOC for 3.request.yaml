$kind: http-request
url: '{{base_url}}/v1/markets/SOL-USD/orders'
method: POST
headers:
  content-type: application/json
  x-orderflow-key: '{{trader_b_key}}'
body:
  type: json
  content: |-
    {
      "side": "buy",
      "type": "limit",
      "price": "150",
      "quantity": "3",
      "time_in_force": "ioc"
    }
scripts:
- type: afterResponse
  code: |-
    pm.test('status is 201', function () { pm.response.to.have.status(201); });
    pm.test('fills 1 and cancels the rest', function () {
        const body = pm.response.json();
        pm.expect(body.order.status).to.eql('cancelled');
        pm.expect(body.order.cancel_reason).to.eql('immediate_or_cancel');
        pm.expect(body.order.filled_quantity).to.eql('1');
    });
  language: text/javascript
order: 2000
