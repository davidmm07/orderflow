$kind: http-request
url: '{{base_url}}/v1/markets/BTC-USD/book?depth=5'
method: GET
queryParams:
  depth: '5'
scripts:
- type: afterResponse
  code: |-
    pm.test('status is 200', function () { pm.response.to.have.status(200); });
    pm.test('snapshot shape', function () {
        const body = pm.response.json();
        pm.expect(body.market).to.eql('BTC-USD');
        pm.expect(body).to.have.property('sequence');
        pm.expect(body).to.have.property('last_price');
        pm.expect(body.bids).to.be.an('array');
    });
  language: text/javascript
order: 9000
