$kind: http-request
url: '{{base_url}}/health/live'
method: GET
scripts:
- type: afterResponse
  code: |-
    pm.test('status is 200', function () { pm.response.to.have.status(200); });
    pm.test('status is ok', function () {
        const body = pm.response.json();
        pm.expect(body.status).to.eql('ok');
    });
  language: text/javascript
order: 2000
