$kind: http-request
url: '{{base_url}}/v1/markets?base=ETH'
method: GET
queryParams:
  base: ETH
scripts:
- type: afterResponse
  code: |-
    pm.test('status is 200', function () { pm.response.to.have.status(200); });
    pm.test('only ETH markets', function () {
        const body = pm.response.json();
        pm.expect(body.markets.every(m => m.base === 'ETH')).to.be.true;
        pm.expect(body.markets.length).to.eql(4);
    });
  language: text/javascript
order: 7000
