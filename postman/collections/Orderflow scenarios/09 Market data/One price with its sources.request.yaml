$kind: http-request
url: '{{pricefeed_url}}/v1/prices/BTC-USD'
method: GET
scripts:
- type: afterResponse
  code: |-
    pm.test('200, or 503 while the feed warms up', function () {
        pm.expect([200, 503]).to.include(pm.response.code);
    });
    if (pm.response.code === 200) {
        pm.test('the breakdown explains the index', function () {
            const body = pm.response.json();
            const used = body.components.filter(function (c) { return c.state === 'used'; });
            pm.expect(used.length).to.eql(body.sources_used);
            body.components.forEach(function (c) {
                pm.expect(['used', 'outlier', 'stale', 'monitor']).to.include(c.state);
                pm.expect(['aggregator', 'cex', 'dex', 'venue']).to.include(c.kind);
            });
        });
    } else {
        pm.test('a missing price is a retryable problem', function () {
            pm.expect(pm.response.json().code).to.eql('price_unavailable');
            pm.expect(pm.response.headers.get('retry-after')).to.eql('1');
        });
    }
  language: text/javascript
order: 4000
