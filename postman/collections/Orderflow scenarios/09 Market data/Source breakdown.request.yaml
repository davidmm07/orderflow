$kind: http-request
url: '{{pricefeed_url}}/v1/sources'
method: GET
scripts:
- type: afterResponse
  code: |-
    pm.test('status is 200', function () { pm.response.to.have.status(200); });
    pm.test('sources are typed', function () {
        pm.response.json().sources.forEach(function (s) {
            pm.expect(['aggregator', 'cex', 'dex', 'venue']).to.include(s.kind);
            pm.expect(s.markets.length).to.be.above(0);
        });
    });
  language: text/javascript
order: 6000
