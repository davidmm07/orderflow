$kind: http-request
url: '{{pricefeed_url}}/health/ready'
method: GET
scripts:
- type: afterResponse
  code: |-
    pm.test('status is 200', function () { pm.response.to.have.status(200); });
    pm.test('the node can serve live prices', function () {
        pm.expect(pm.response.json().status).to.eql('ready');
    });
  language: text/javascript
order: 1000
