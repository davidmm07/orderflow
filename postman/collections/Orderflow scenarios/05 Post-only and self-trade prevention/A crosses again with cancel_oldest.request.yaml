$kind: http-request
url: '{{base_url}}/v1/markets/AVAX-USD/orders'
method: POST
headers:
  content-type: application/json
  x-orderflow-key: '{{trader_a_key}}'
body:
  type: json
  content: |-
    {
      "side": "buy",
      "type": "limit",
      "price": "30",
      "quantity": "1",
      "self_trade_prevention": "cancel_oldest"
    }
scripts:
- type: afterResponse
  code: |-
    pm.test('status is 201', function () { pm.response.to.have.status(201); });
    pm.test('old ask removed, new bid rests', function () {
        const body = pm.response.json();
        pm.expect(body.order.status).to.eql('open');
        pm.expect(body.fills).to.eql([]);
    });
    pm.collectionVariables.set('avax_a_bid_id', pm.response.json().order.id);
  language: text/javascript
order: 6000
