$kind: http-request
url: '{{base_url}}/v1/markets/AVAX-USD/orders'
method: POST
headers:
  content-type: application/json
  x-orderflow-key: '{{trader_b_key}}'
body:
  type: json
  content: |-
    {
      "side": "buy",
      "type": "limit",
      "price": "30",
      "quantity": "1",
      "post_only": true
    }
scripts:
- type: afterResponse
  code: |-
    pm.test('status is 409', function () { pm.response.to.have.status(409); });
    pm.test('problem code is post_only_would_cross', function () {
        pm.expect(pm.response.headers.get('content-type')).to.include('application/problem+json');
        pm.expect(pm.response.json().code).to.eql('post_only_would_cross');
    });
  language: text/javascript
order: 2000
