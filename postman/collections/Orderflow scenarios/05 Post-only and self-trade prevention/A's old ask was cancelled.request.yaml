$kind: http-request
url: '{{base_url}}/v1/markets/AVAX-USD/orders/{{avax_ask_id}}'
method: GET
headers:
  x-orderflow-key: '{{trader_a_key}}'
scripts:
- type: afterResponse
  code: |-
    pm.test('status is 200', function () { pm.response.to.have.status(200); });
    pm.test('cancelled by self-trade prevention', function () {
        const body = pm.response.json();
        pm.expect(body.status).to.eql('cancelled');
        pm.expect(body.cancel_reason).to.eql('self_trade_prevention');
    });
  language: text/javascript
order: 7000
