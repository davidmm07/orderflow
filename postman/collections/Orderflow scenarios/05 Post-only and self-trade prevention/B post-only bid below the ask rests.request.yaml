$kind: http-request
url: '{{base_url}}/v1/markets/AVAX-USD/orders'
method: POST
headers:
  content-type: application/json
  x-orderflow-key: '{{trader_b_key}}'
body:
  type: json
  content: |-
    {
      "side": "buy",
      "type": "limit",
      "price": "29.99",
      "quantity": "1",
      "post_only": true
    }
scripts:
- type: afterResponse
  code: |-
    pm.test('status is 201', function () { pm.response.to.have.status(201); });
    pm.test('bid is open', function () {
        const body = pm.response.json();
        pm.expect(body.order.status).to.eql('open');
    });
    pm.collectionVariables.set('avax_b_bid_id', pm.response.json().order.id);
  language: text/javascript
order: 3000
