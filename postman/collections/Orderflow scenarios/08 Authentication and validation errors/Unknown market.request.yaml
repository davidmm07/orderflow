$kind: http-request
url: '{{base_url}}/v1/markets/DOGE-EUR/orders'
method: POST
headers:
  content-type: application/json
  x-orderflow-key: '{{trader_a_key}}'
body:
  type: json
  content: |-
    {
      "side": "buy",
      "type": "limit",
      "price": "1",
      "quantity": "10"
    }
scripts:
- type: afterResponse
  code: |-
    pm.test('status is 404', function () { pm.response.to.have.status(404); });
    pm.test('problem code is unknown_market', function () {
        pm.expect(pm.response.headers.get('content-type')).to.include('application/problem+json');
        pm.expect(pm.response.json().code).to.eql('unknown_market');
    });
  language: text/javascript
order: 11000
