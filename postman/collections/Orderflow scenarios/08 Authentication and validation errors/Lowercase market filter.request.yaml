$kind: http-request
url: '{{base_url}}/v1/markets?base=btc'
method: GET
queryParams:
  base: btc
scripts:
- type: afterResponse
  code: |-
    pm.test('status is 422', function () { pm.response.to.have.status(422); });
    pm.test('problem code is validation_failed', function () {
        pm.expect(pm.response.headers.get('content-type')).to.include('application/problem+json');
        pm.expect(pm.response.json().code).to.eql('validation_failed');
    });
    pm.test('field errors: base', function () {
        pm.expect(pm.response.json().errors.map(e => e.field)).to.eql(['base']);
    });
  language: text/javascript
order: 13000
