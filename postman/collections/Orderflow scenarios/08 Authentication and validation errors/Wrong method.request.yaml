$kind: http-request
url: '{{base_url}}/v1/markets'
method: PUT
scripts:
- type: afterResponse
  code: |-
    pm.test('status is 405', function () { pm.response.to.have.status(405); });
    pm.test('problem code is method_not_allowed', function () {
        pm.expect(pm.response.headers.get('content-type')).to.include('application/problem+json');
        pm.expect(pm.response.json().code).to.eql('method_not_allowed');
    });
  language: text/javascript
order: 15000
