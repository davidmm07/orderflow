$kind: http-request
url: '{{base_url}}/v1/markets/LTC-USD/orders/{{ltc_bid_id}}'
method: DELETE
headers:
  x-orderflow-key: '{{trader_a_key}}'
scripts:
- type: afterResponse
  code: |-
    pm.test('status is 409', function () { pm.response.to.have.status(409); });
    pm.test('problem code is order_not_open', function () {
        pm.expect(pm.response.headers.get('content-type')).to.include('application/problem+json');
        pm.expect(pm.response.json().code).to.eql('order_not_open');
    });
  language: text/javascript
order: 7000
