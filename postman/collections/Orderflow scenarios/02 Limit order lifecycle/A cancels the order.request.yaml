$kind: http-request
url: '{{base_url}}/v1/markets/LTC-USD/orders/{{ltc_bid_id}}'
method: DELETE
headers:
  x-orderflow-key: '{{trader_a_key}}'
scripts:
- type: afterResponse
  code: |-
    pm.test('status is 200', function () { pm.response.to.have.status(200); });
    pm.test('order is cancelled', function () {
        const body = pm.response.json();
        pm.expect(body.status).to.eql('cancelled');
        pm.expect(body.cancel_reason).to.eql('requested');
    });
  language: text/javascript
order: 6000
