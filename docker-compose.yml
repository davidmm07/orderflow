# Local stack: Orderflow publishing to a single node Redpanda (Kafka API),
# the price feed (one ingest node, one edge node, Postgres and Valkey),
# all monitored by Prometheus and Grafana.
#
#   make env        # once, creates .env with two traders and a DB password
#   make up         # build and start
#   make consume    # watch events arrive on the topic
#   make down       # stop and delete volumes
#
#   Exchange API   http://127.0.0.1:8080
#   Price feed     http://127.0.0.1:8090  (REST and ws://127.0.0.1:8090/v1/ws)
#   Prometheus     http://127.0.0.1:9090  (targets, alerts, queries)
#   Grafana        http://127.0.0.1:3000  (Orderflow and Price feed dashboards)
#
# Compose reads ORDERFLOW_API_CREDENTIALS and PRICEFEED_DB_PASSWORD from .env
# for interpolation. The price feed reaches public exchange APIs and public
# Ethereum and Solana RPC nodes; set PRICEFEED_EVM_RPC_URL and
# PRICEFEED_SOLANA_RPC_URL in .env to use your own provider instead.

name: orderflow

services:
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v26.2.3
    command:
      - redpanda
      - start
      - --mode=dev-container
      - --smp=1
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr=internal://redpanda:9092,external://127.0.0.1:19092
    ports:
      - "127.0.0.1:19092:19092"
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -E 'Healthy:.+true'"]
      interval: 2s
      timeout: 5s
      retries: 30

  # Creates the topic up front with several partitions. Events are keyed by
  # market, so each market stays ordered on its own partition.
  topics:
    image: docker.redpanda.com/redpandadata/redpanda:v26.2.3
    entrypoint:
      - rpk
      - topic
      - create
      - orderflow.events.v1
      - --partitions=6
      - --if-not-exists
      - -X
      - brokers=redpanda:9092
    depends_on:
      redpanda:
        condition: service_healthy

  orderflow:
    build: .
    environment:
      ORDERFLOW_API_CREDENTIALS: ${ORDERFLOW_API_CREDENTIALS:?run make env first}
      ORDERFLOW_EVENT_SINK: kafka
      ORDERFLOW_KAFKA_BROKERS: redpanda:9092
      ORDERFLOW_KAFKA_TOPIC: orderflow.events.v1
      RUST_LOG: info
    ports:
      - "127.0.0.1:8080:8080"
    read_only: true
    security_opt:
      - no-new-privileges:true
    depends_on:
      topics:
        condition: service_completed_successfully

  # Price history and the indexers' checkpoints. Not published on the host:
  # use `docker compose exec postgres psql -U pricefeed` to look inside.
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: pricefeed
      POSTGRES_USER: pricefeed
      POSTGRES_PASSWORD: ${PRICEFEED_DB_PASSWORD:?run make pricefeed-env to add it to .env}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pricefeed -d pricefeed"]
      interval: 2s
      timeout: 5s
      retries: 30

  # Price bus between the ingest node and edge nodes, plus the shared candle
  # cache. Valkey is the open source Redis fork ElastiCache runs. A cache
  # with nothing to persist: no snapshots, LRU eviction at the memory cap.
  valkey:
    image: valkey/valkey:8.1.10-alpine
    command: ["valkey-server", "--save", "", "--appendonly", "no",
              "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 2s
      timeout: 5s
      retries: 30

  # Runs the sources and the aggregator; writes Postgres, publishes Valkey.
  # Start a second copy and it waits as a standby for the ingest lease.
  pricefeed-ingest:
    build:
      context: .
      target: pricefeed
    environment:
      PRICEFEED_ROLE: ingest
      PRICEFEED_DATABASE_URL: postgres://pricefeed:${PRICEFEED_DB_PASSWORD}@postgres:5432/pricefeed
      PRICEFEED_REDIS_URL: redis://valkey:6379
      PRICEFEED_KAFKA_BROKERS: redpanda:9092
      PRICEFEED_KAFKA_TOPIC: orderflow.events.v1
      PRICEFEED_EVM_RPC_URL: ${PRICEFEED_EVM_RPC_URL:-https://ethereum-rpc.publicnode.com}
      PRICEFEED_SOLANA_RPC_URL: ${PRICEFEED_SOLANA_RPC_URL:-https://api.mainnet-beta.solana.com}
      PRICEFEED_COINGECKO_API_KEY: ${PRICEFEED_COINGECKO_API_KEY:-}
      RUST_LOG: info
    read_only: true
    security_opt:
      - no-new-privileges:true
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
      topics:
        condition: service_completed_successfully

  # Serves clients. Stateless: scale it out behind a load balancer.
  pricefeed:
    build:
      context: .
      target: pricefeed
    environment:
      PRICEFEED_ROLE: edge
      PRICEFEED_DATABASE_URL: postgres://pricefeed:${PRICEFEED_DB_PASSWORD}@postgres:5432/pricefeed
      PRICEFEED_REDIS_URL: redis://valkey:6379
      RUST_LOG: info
    ports:
      - "127.0.0.1:8090:8090"
    read_only: true
    security_opt:
      - no-new-privileges:true
    depends_on:
      pricefeed-ingest:
        condition: service_started

  prometheus:
    image: prom/prometheus:v3.15.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=2d
    volumes:
      - ./deploy/prometheus:/etc/prometheus:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    depends_on:
      - orderflow
      - pricefeed

  # View-only Grafana for local use: anonymous viewers, no login form and no
  # basic auth, so there is no default admin password to leave exposed.
  # Datasource and dashboard come from files under deploy/grafana.
  grafana:
    image: grafana/grafana:13.2.2
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_AUTH_BASIC_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_USERS_VIEWERS_CAN_EDIT: "true"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/orderflow.json
    volumes:
      - ./deploy/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./deploy/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - prometheus

volumes:
  prometheus-data:
  postgres-data:
