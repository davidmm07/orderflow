[workspace]
resolver = "3"
members = ["crates/domain", "crates/application", "crates/infrastructure"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/davidmm07/orderflow"
publish = false

[workspace.dependencies]
orderflow-domain = { path = "crates/domain" }
orderflow-application = { path = "crates/application" }
orderflow-infrastructure = { path = "crates/infrastructure" }
orderflow-api = { path = "crates/api" }

anyhow = "1.0.100"
async-trait = "0.1.89"
axum = { version = "0.8.9", features = ["macros"] }
chrono = { version = "0.4.42", default-features = false, features = ["std"] }
criterion = "0.8.2"
dotenvy = "0.15.7"
hex = "0.4.3"
hmac = "0.13.0"
http-body-util = "0.1.3"
proptest = "1.9.0"
rdkafka = "0.39.0"
rust_decimal = { version = "1.39.0", default-features = false, features = ["std"] }
rust_decimal_macros = "1.39.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.11.0"
thiserror = "2.0.17"
tokio = "1.48.0"
tower = "0.5.2"
tower-http = "0.7.1"
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter", "json"] }
uuid = { version = "1.18.1", default-features = false, features = ["std"] }

[workspace.lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"

[profile.release]
codegen-units = 1
lto = "thin"
