[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/davidmm07/orderflow"
publish = false

[workspace.dependencies]
orderflow-domain = { path = "crates/domain" }
orderflow-application = { path = "crates/application" }
orderflow-infrastructure = { path = "crates/infrastructure" }
orderflow-api = { path = "crates/api" }
orderflow-ingest = { path = "crates/ingest" }
orderflow-marketdata = { path = "crates/marketdata" }
orderflow-storage = { path = "crates/storage" }

alloy-primitives = { version = "1.7.3", default-features = false, features = ["serde", "std"] }
alloy-sol-types = { version = "1.7.3", default-features = false, features = ["std"] }
anyhow = "1.0.100"
async-trait = "0.1.89"
axum = { version = "0.8.9", features = ["macros"] }
base64 = "0.22.1"
bs58 = "0.5.1"
chrono = { version = "0.4.42", default-features = false, features = ["std"] }
criterion = "0.8.2"
dotenvy = "0.15.7"
futures-util = { version = "0.3.34", default-features = false, features = ["sink", "std"] }
hex = "0.4.3"
hmac = "0.13.0"
http-body-util = "0.1.3"
moka = { version = "0.12.16", features = ["future"] }
proptest = "1.9.0"
rdkafka = "0.39.0"
# TLS everywhere goes through rustls with the ring provider: no OpenSSL and
# no C toolchain for crypto.
redis = { version = "1.7.1", default-features = false, features = ["connection-manager", "tokio-comp", "tokio-rustls-comp"] }
reqwest = { version = "0.13.5", default-features = false, features = ["http2", "json", "query", "rustls-no-provider"] }
rustls = { version = "0.23.45", default-features = false, features = ["logging", "ring", "std", "tls12"] }
rust_decimal = { version = "1.39.0", default-features = false, features = ["std"] }
rust_decimal_macros = "1.39.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.145", features = ["raw_value"] }
sha2 = "0.11.0"
sqlx = { version = "0.9.0", default-features = false, features = ["chrono", "macros", "migrate", "postgres", "runtime-tokio", "rust_decimal", "tls-rustls-ring-native-roots"] }
thiserror = "2.0.17"
tokio = "1.48.0"
tokio-stream = { version = "0.1.19", features = ["sync"] }
tokio-tungstenite = { version = "0.29.0", default-features = false, features = ["connect", "rustls-tls-native-roots"] }
tokio-util = { version = "0.7.19", features = ["rt"] }
tower = "0.5.2"
tower-http = "0.7.1"
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter", "json"] }
uuid = { version = "1.18.1", default-features = false, features = ["std"] }

[workspace.lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"

[profile.release]
codegen-units = 1
lto = "thin"
