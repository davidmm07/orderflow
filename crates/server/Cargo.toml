[package]
name = "orderflow-server"
description = "Orderflow server binary: configuration, composition root and lifecycle."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "orderflow"
path = "src/main.rs"

[features]
default = []
kafka = ["orderflow-infrastructure/kafka"]

[dependencies]
anyhow.workspace = true
axum.workspace = true
dotenvy.workspace = true
orderflow-api.workspace = true
orderflow-application.workspace = true
orderflow-domain.workspace = true
orderflow-infrastructure.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["macros", "net", "rt-multi-thread", "signal", "time"] }
tracing.workspace = true
tracing-subscriber.workspace = true

[lints]
workspace = true
