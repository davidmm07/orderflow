[package]
name = "orderflow-infrastructure"
description = "Adapters for Orderflow ports: storage, clocks, ids, metrics and event sinks."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
default = []
# Kafka publisher backed by librdkafka, which is compiled from source.
kafka = ["dep:rdkafka"]

[dependencies]
async-trait.workspace = true
orderflow-application.workspace = true
orderflow-domain.workspace = true
rdkafka = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["sync", "time"] }
tracing.workspace = true
uuid = { workspace = true, features = ["v7"] }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt", "test-util"] }

[lints]
workspace = true
