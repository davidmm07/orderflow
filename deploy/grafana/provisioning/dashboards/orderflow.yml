# Loads every dashboard JSON file in deploy/grafana/dashboards. Dashboards
# are code: change the JSON file and restart Grafana; edits made in the UI
# are not saved.
apiVersion: 1
providers:
  - name: orderflow
    folder: Orderflow
    type: file
    disableDeletion: true
    allowUiUpdates: false
    options:
      path: /var/lib/grafana/dashboards
