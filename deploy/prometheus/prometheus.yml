# Prometheus for the local compose stack: scrapes Orderflow and the price
# feed over the compose network and evaluates the alert rules in alerts.yml.
#
# The 5 second interval suits a demo. Production setups usually scrape every
# 15 to 30 seconds and send alerts on to Alertmanager.
global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - alerts.yml

scrape_configs:
  - job_name: orderflow
    metrics_path: /metrics
    static_configs:
      - targets: ["orderflow:8080"]

  # One job, two roles: the ingest node reports sources, indexers and the
  # store; the edge node reports WebSocket and cache metrics.
  - job_name: pricefeed
    metrics_path: /metrics
    static_configs:
      - targets: ["pricefeed-ingest:8090"]
        labels:
          role: ingest
      - targets: ["pricefeed:8090"]
        labels:
          role: edge
