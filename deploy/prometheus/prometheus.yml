# Prometheus for the local compose stack: scrapes Orderflow over the compose
# network and evaluates the alert rules in alerts.yml.
#
# The 5 second interval suits a demo. Production setups usually scrape every
# 15 to 30 seconds and send alerts on to Alertmanager.
global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - alerts.yml

scrape_configs:
  - job_name: orderflow
    metrics_path: /metrics
    static_configs:
      - targets: ["orderflow:8080"]
